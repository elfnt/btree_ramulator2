<title>B-tree 損毀示意圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* layout: one white figure card on a cool plane; two panels side by side sharing one tree, one takeaway line beneath */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#10151c; --ink-2:#465061; --muted:#7a8494; --rule:#dfe4eb;
  --line:#c0c7d1; --node:#ffffff; --node-stroke:#5b6676; --path:#2a78d6; --bad:#d03b3b; --bad-ink:#b02a2a; --bad-tint:#fdeaea; --on-bad:#ffffff; --pay:#e6ebf2; --pay-dim:#f1f4f8;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1114; --surface:#15181c; --ink:#f1f3f6; --ink-2:#b7bfca; --muted:#8791a0; --rule:#2a3038;
    --line:#3b424c; --node:#1c2127; --node-stroke:#7c8797; --path:#4f97ee; --bad:#e05252; --bad-ink:#ff9494; --bad-tint:#371b1f; --on-bad:#ffffff; --pay:#2a313a; --pay-dim:#20262d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#15181c; --ink:#f1f3f6; --ink-2:#b7bfca; --muted:#8791a0; --rule:#2a3038;
  --line:#3b424c; --node:#1c2127; --node-stroke:#7c8797; --path:#4f97ee; --bad:#e05252; --bad-ink:#ff9494; --bad-tint:#371b1f; --on-bad:#ffffff; --pay:#2a313a; --pay-dim:#20262d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.page{max-width:1376px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;padding:5px 14px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--path);outline-offset:-2px}
.fig{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;gap:22px;min-width:0}
.fig-title{margin:0;font-size:clamp(20px,2.4vw,26px);line-height:1.35;font-weight:700;letter-spacing:-.005em;text-wrap:balance;max-width:34em}
.panels{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.panel{display:flex;flex-direction:column;gap:10px;min-width:0;padding-block:22px}
.panel:first-child{padding-top:0}
.panel + .panel{border-top:1px solid var(--rule)}
.panel:last-child{padding-bottom:0}
@media (min-width:1180px){
  .panels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{padding-block:0;padding-inline:28px}
  .panel:first-child{padding-left:0}
  .panel:last-child{padding-right:0}
  .panel + .panel{border-top:0;border-left:1px solid var(--rule)}
}
.p-head{display:flex;flex-direction:column;gap:2px}
.p-title{margin:0;font-size:18px;font-weight:700;line-height:1.4}
.p-title .where{font-style:normal;font-family:var(--f-mono);font-weight:500;font-size:.95em;padding:1px 7px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.p-sub{margin:0;font-size:14px;color:var(--ink-2)}
.diagram{overflow-x:auto;max-width:100%}
.diagram svg{display:block;width:100%;min-width:520px;max-width:640px;height:auto;margin:0 auto}
.outcome{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.outcome b{color:var(--ink);font-weight:700;margin-right:.5em}
.panel.is-bad .outcome b{color:var(--bad-ink)}
.take{margin:0;border-top:1px solid var(--rule);padding-top:18px;font-size:17px;line-height:1.6;display:flex;flex-wrap:wrap;gap:2px 10px}
.take .now{color:var(--ink-2)}
.take .we{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px 36px;margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.legend li{display:flex;align-items:center;gap:10px;min-width:0}
.legend svg{flex:none;width:54px;height:40px}
.legend b{color:var(--ink);font-family:var(--f-mono);font-weight:500;margin-right:.4em;white-space:nowrap}
figcaption{font-size:13px;color:var(--muted);line-height:1.6;max-width:60em}
/* svg */
.n-fill{fill:var(--node)} .n-out{fill:none;stroke:var(--node-stroke);stroke-width:1.25} .n-div{stroke:var(--node-stroke);stroke-width:1}
.n-flip{fill:var(--bad)}
.n-pay{fill:var(--pay)} .dim .n-pay{fill:var(--pay-dim)}
.t-pay{font-family:var(--f-mono);font-size:9.5px;fill:var(--ink-2);text-anchor:middle} .dim .t-pay{fill:var(--muted)}
.dim .n-out,.dim .n-div{stroke:var(--line)}
.t-key{font-family:var(--f-mono);font-size:11.5px;fill:var(--ink);text-anchor:middle}
.dim .t-key{fill:var(--muted)}
.t-key.t-flip{fill:var(--on-bad);font-weight:500}
.t-code{font-family:var(--f-mono);font-size:12px;fill:var(--ink)}
.t-level{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.t-bad{font-size:12.5px;font-weight:700;fill:var(--bad-ink)}
.t-sm{font-size:12px}
.t-res{font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-muted{font-size:12px;fill:var(--ink-2)}
.edge{stroke:var(--line);stroke-width:1}
.path{stroke:var(--path);stroke-width:2}
.wrong{stroke:var(--bad);stroke-width:2}
.ghost{stroke:var(--muted);stroke-width:1.25;stroke-dasharray:4 4}
.tick-bad{stroke:var(--bad);stroke-width:1.5}
.m-path{fill:var(--path)} .m-bad{fill:var(--bad)} .m-ghost{fill:var(--muted)}
.i-bad{fill:var(--bad)} .i-x{stroke:var(--bad);stroke-width:2;fill:none;stroke-linecap:round}
.lost{fill:var(--bad-tint);stroke:var(--bad);stroke-width:1.25;stroke-dasharray:5 4}
</style>

<script>
(function(){
  var els=document.querySelectorAll('[data-zh]'), svgs=document.querySelectorAll('svg[data-label-zh]');
  var bz=document.getElementById('lang-zh'), be=document.getElementById('lang-en');
  function setLang(l,save){
    if(l!=='en')l='zh';
    els.forEach(function(e){e.textContent=e.getAttribute('data-'+l);});
    svgs.forEach(function(s){s.setAttribute('aria-label',s.getAttribute('data-label-'+l));});
    document.documentElement.lang=l==='zh'?'zh-Hant':'en';
    bz.setAttribute('aria-pressed',String(l==='zh')); be.setAttribute('aria-pressed',String(l==='en'));
    if(save){try{localStorage.setItem('fig-lang',l);}catch(e){}}
  }
  bz.addEventListener('click',function(){setLang('zh',true);});
  be.addEventListener('click',function(){setLang('en',true);});
  var init='zh', h=(location.hash||'').replace('#','');
  if(h==='en'||h==='zh')init=h; else{try{if(localStorage.getItem('fig-lang')==='en')init='en';}catch(e){}}
  if(init!=='zh')setLang(init,false);
})();
</script>
